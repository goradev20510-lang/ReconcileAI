services:
  - type: web
    name: reconcileai
    runtime: docker
    plan: free
    rootDir: ReconcileAI
    dockerfilePath: ./Dockerfile
    healthCheckPath: /_stcore/health
    envVars:
      - key: APP_ENV
        value: production
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
