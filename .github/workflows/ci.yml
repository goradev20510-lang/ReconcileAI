name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ReconcileAI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ReconcileAI/requirements.txt
      - run: pip install -r requirements.txt
      - name: Tests (offline, throw-away databases)
        run: python -m pytest tests -q
        env:
          LLM_ENABLED: "0"
      - name: Demo smoke test
        run: python -m scripts.smoke_reconcile
